name: Unified Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: unified-schedule-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_REMOTE_SYNC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_TIMEZONE: Europe/Paris
      DATABASE_PATH: data/unified_schedule.sqlite3
      PYTHONUTF8: '1'
      ADE_ICS_URL: ${{ secrets.ADE_ICS_URL }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      GOOGLE_ADE_CALENDAR_ID: ${{ secrets.GOOGLE_ADE_CALENDAR_ID }}
      GOOGLE_WORKFORCE_CALENDAR_ID: ${{ secrets.GOOGLE_WORKFORCE_CALENDAR_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Installer Python et Chromium
        run: |
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Restaurer les autorisations depuis les secrets
        env:
          WORKFORCE_STATE_JSON: ${{ secrets.WORKFORCE_STATE_JSON }}
          GOOGLE_WRITE_TOKEN_JSON: ${{ secrets.GOOGLE_WRITE_TOKEN_JSON }}
        run: python scripts/prepare-actions.py
      - name: Actualiser et synchroniser
        run: python scripts/run-actions.py
      - name: Nettoyer les fichiers privés
        if: always()
        run: |
          rm -f secrets/google-write-token.json playwright/.auth/workforce.json
